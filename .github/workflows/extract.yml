name: Extract ZIP
on:
  push:
    branches: [main]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract mipmaps.zip
        run: |
          cd app/src/main/res
          unzip mipmaps.zip -d .
          rm mipmaps.zip
      
      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Extract mipmaps.zip" || echo "No changes"
          git push
